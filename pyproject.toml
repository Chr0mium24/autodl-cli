[project]
name = "autodl-cli"
version = "0.1.0"
description = "AutoDL 非官方命令行：查行情、租卡、开关机、定时关机、SSH、并行传输、释放实例（走网页内部接口）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["requests>=2.28"]

[project.scripts]
autodl = "autodl_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodl_cli"]
